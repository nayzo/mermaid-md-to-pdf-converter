name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Test CLI help
      run: node cli.js --help

    - name: Test conversion with example file
      run: node cli.js example.md test-output.pdf

    - name: Verify PDF was generated
      run: |
        if [ ! -f test-output.pdf ]; then
          echo "PDF file was not generated"
          exit 1
        fi
        echo "PDF generated successfully"

    - name: Upload PDF artifact
      uses: actions/upload-artifact@v4
      with:
        name: test-pdf-node-${{ matrix.node-version }}
        path: test-output.pdf
        retention-days: 7
